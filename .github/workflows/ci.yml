name: Storefront checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: ecl-disposable-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: storefront
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # CI never receives production service/provider credentials. Tests use
      # PGlite, disposable PostgreSQL and fake providers; no database is deployed.
      SUPABASE_DB_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      RESEND_API_KEY: ''
      RESEND_WEBHOOK_SECRET: ''
      GA4_API_SECRET: ''
      ORDER_ACCESS_SECRET: ''
      UNSUBSCRIBE_SECRET: ''
      CRON_SECRET: ''
      NEXT_PUBLIC_GA4_ID: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Isolated regression tests and migration validation
        run: npm test
      - name: Independent PostgreSQL sessions and backup restoration
        run: npm run test:postgres
        env:
          ECL_TEST_PG_URL: postgresql://postgres:ecl-disposable-test-only@127.0.0.1:5432/postgres
          ECL_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: Install isolated acceptance browser
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility acceptance with synthetic fixtures
        run: npm run test:browser
      - name: High-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build without service credentials
        run: npm run build
      - name: Private response headers from the production build
        run: npm run test:headers
      - name: Route JavaScript budgets
        run: npm run check:budgets
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-acceptance
          path: |
            storefront/playwright-report/
            storefront/test-results/
          retention-days: 7
          if-no-files-found: ignore
