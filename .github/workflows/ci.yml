name: Storefront checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: storefront
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # CI never receives production service/provider credentials. Tests use
      # in-memory PGlite and fake provider boundaries; no database is deployed.
      SUPABASE_DB_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      RESEND_API_KEY: ''
      RESEND_WEBHOOK_SECRET: ''
      GA4_API_SECRET: ''
      ORDER_ACCESS_SECRET: ''
      UNSUBSCRIBE_SECRET: ''
      CRON_SECRET: ''
      NEXT_PUBLIC_GA4_ID: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Isolated regression tests and migration validation
        run: npm test
      - name: High-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build without service credentials
        run: npm run build
