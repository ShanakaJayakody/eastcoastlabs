name: Scheduled sweeps

# Vercel's Hobby plan caps cron jobs at once per day. Three of the four sweeps
# lose real value at that cadence — most of all abandoned-cart stage 1, which is
# meant to land ~1h after someone walks away and is the touch that converts.
#
# This workflow drives those three hourly for free. The vercel.json crons stay
# in place as a daily backstop: every sweep is idempotent (atomic claim +
# outbox dedupe), so the two schedules overlapping is harmless by design.
#
# The marketing lifecycle sweep is deliberately NOT here — it stays daily in
# vercel.json. Running welcome/winback/replenishment hourly would do nothing
# useful and risks looking spammy if an eligibility window is ever mis-set.
#
# NOTE ON RELIABILITY: GitHub's scheduled runs are best-effort. They are often
# delayed 5-30 minutes under load and are occasionally skipped entirely, and
# GitHub disables schedules on repos with 60 days of no activity. That is fine
# for sweeps that are idempotent and windowed — a late run still catches the
# cart — but this is not a guarantee. If these sweeps ever become
# revenue-critical, Vercel Pro ($20/mo) buys real cron.

on:
  schedule:
    # Hourly, at :10 past. Offset from :00 because that is when GitHub's
    # scheduler is most congested and delays are worst.
    - cron: "10 * * * *"
  # Lets you fire a sweep by hand from the Actions tab to test or catch up.
  workflow_dispatch:

# A slow run must never overlap the next tick.
concurrency:
  group: scheduled-sweeps
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Independent sweeps: one failing must not cancel the others.
      fail-fast: false
      matrix:
        endpoint:
          - email-outbox      # retry path for failed transactional sends
          - abandoned-carts   # stage 1 wants ~1h, not ~24h
          - payment-ops       # 4h/24h payment reminders + 48h expiry
    steps:
      - name: Call ${{ matrix.endpoint }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.CRON_BASE_URL || 'https://eastcoastlabs.vercel.app' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          url="${BASE_URL}/api/cron/${{ matrix.endpoint }}"
          echo "→ ${url}"

          # --fail-with-body so a non-2xx is a failure but we still see why.
          # Retry transient network/5xx a couple of times before giving up.
          body=$(curl -sS --fail-with-body \
                      --retry 2 --retry-delay 5 --retry-all-errors \
                      --max-time 120 \
                      -H "Authorization: Bearer ${CRON_SECRET}" \
                      "${url}")

          echo "${body}"
          echo "### ${{ matrix.endpoint }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "${body}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
