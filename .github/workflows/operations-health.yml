name: Production health monitoring

on:
  schedule:
    # Every five minutes, offset from the busy start of the hour. Best effort.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitoring
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Check public availability and operations health
        run: node storefront/scripts/probe-operations.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
