<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated storefront audit preview</title><style>body{margin:0;background:#202630;color:#fff;font:14px system-ui}header{padding:12px}select,button{padding:8px}iframe{display:block;margin:0 auto;border:2px solid #758294;background:#080b10;height:844px;width:390px}</style></head><body><header><strong>Local synthetic storefront QA</strong> <label>Viewport width <select id="width"><option>390</option><option>320</option><option>1024</option></select></label> <button id="measure">Measure layout</button> <output id="measurement">Select a viewport and load the synthetic cart.</output></header><iframe id="preview" src="/frame.html" title="Storefront component viewport"></iframe><script type="module">
const frame=document.getElementById('preview');document.getElementById('width').addEventListener('change',event=>{frame.style.width=event.target.value+'px'});document.getElementById('measure').addEventListener('click',()=>{const doc=frame.contentDocument;document.getElementById('measurement').textContent=`Viewport ${frame.contentWindow.innerWidth}px; document ${doc.documentElement.scrollWidth}px; overflow ${Math.max(0,doc.documentElement.scrollWidth-frame.contentWindow.innerWidth)}px.`;});
</script></body></html>
